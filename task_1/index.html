<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment_3-task-1</title>
    <link rel="stylesheet" href="./style.css">
    <link
  href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
  rel="stylesheet"
/>
</head>
<body>
    <div class="container">
        <h1 class="right-logo">SQUID</h1>
        <h1 class="bottom-logo">GAME</h1>
        <header>        
            <img src="./image/logo.png" alt="">
            <nav>
                <h5>About</h5>
                <h5>Watch Now</h5>
                <h5>Actors</h5>
                <h5>Contact</h5>
            </nav>
            <i class="ri-menu-3-line"></i>
        </header>
        <main>
            <div class="left">
                <img src="./image/logo.png" width="380" alt="">
                <p>Action/Thriller/Drama Series directed by Dong-hyuk Hwang</p>
                <p>Season 1: 9 Episodes</p>
                <div class="btn">
                    <button id="btn1"><div class="icon"><i class="ri-play-fill"></i></div>Play Now</button>
                    <button id="btn2"><i class="ri-play-line"></i>Watch Trailer</button>
                </div>
            </div>
            <div class="right">
                <img src="./image/main.png" width="460" alt="">
                <div class="text">
                    <hr class="line">
                    <h5>SCROLL</h5>
                </div>
                <div class="media">
                    <i class="ri-twitter-line"></i>
                    <i class="ri-instagram-line"></i>
                    <i class="ri-facebook-line"></i>
                </div>
            </div>
            <section>
                <div class="cards">
                    <img src="https://images6.alphacoders.com/119/1191374.jpg" alt="">
                    <div class="icon"><i class="ri-play-fill"></i></div>
                </div>
                <div class="cards">
                    <img src="https://i.ytimg.com/vi/ZuavWOD_9tY/maxresdefault.jpg" alt="">
                    <div class="icon"><i class="ri-play-fill"></i></div>
                </div>
                <div class="cards">
                    <img src="https://sm.ign.com/t/ign_br/screenshot/default/round-6-playstation_7qvn.280.jpg" alt="">
                    <div class="icon"><i class="ri-play-fill"></i></div>
                </div>
            </section>
        </main>
    </div>
    
</body>
</html>
